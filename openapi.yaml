openapi: 3.0.3
info:
  title: IoT Two-Way Voice Translator API (Vercel Edition)
  description: |
    Single Vercel Project serverless API for ESP32 push-to-talk voice translator devices
    and React administration dashboard. Deployed on Vercel Hobby plan using pure Node.js/TypeScript.
  version: 2.0.0
servers:
  - url: /api/v1
    description: Vercel Functions v1 API base path
  - url: /v1
    description: Direct v1 path

paths:
  /auth/login:
    post:
      summary: Admin login
      description: Validates email and password against ADMIN_EMAIL and bcrypt hash; sets httpOnly paralax_admin_token JWT cookie (12h).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  token:
                    type: string
                  user:
                    type: object
                    properties:
                      email:
                        type: string
                      role:
                        type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitedError'

  /auth/logout:
    post:
      summary: Admin logout
      description: Clears the paralax_admin_token session cookie.
      responses:
        '200':
          description: Logout successful

  /auth/me:
    get:
      summary: Current admin session
      description: Returns information about the currently logged-in administrator.
      responses:
        '200':
          description: Session info
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      email:
                        type: string
                      role:
                        type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /device/translate:
    post:
      summary: Translate spoken audio utterance
      description: |
        Synchronous single round-trip translation for ESP32 push-to-talk.
        Send raw PCM (16 kHz, 16-bit, mono) or WAV (<= 4MB).
        If Accept: application/octet-stream is requested, the audio stream is returned directly
        with translation metadata in X-* response headers.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
          description: Unique client key for idempotent request deduplication
        - name: X-Device-Key
          in: header
          required: true
          schema:
            type: string
          description: Secret authentication key for the device
        - name: X-Direction
          in: header
          required: false
          schema:
            type: string
            enum: [a_to_b, b_to_a, auto]
            default: auto
          description: Direction of translation relative to configured language A and B
        - name: Accept
          in: header
          required: false
          schema:
            type: string
            default: application/octet-stream
      requestBody:
        required: true
        content:
          audio/L16;rate=16000:
            schema:
              type: string
              format: binary
          audio/wav:
            schema:
              type: string
              format: binary
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Translation successful. Returns audio stream or JSON depending on Accept header.
          headers:
            X-Job-Id:
              schema:
                type: string
            X-Source-Language:
              schema:
                type: string
            X-Target-Language:
              schema:
                type: string
            X-Duration-Ms:
              schema:
                type: string
            X-STT-Ms:
              schema:
                type: string
            X-Translate-Ms:
              schema:
                type: string
            X-Synthesize-Ms:
              schema:
                type: string
            X-Total-Ms:
              schema:
                type: string
            X-Transcript:
              schema:
                type: string
              description: Base64url-encoded transcript truncated to 300 characters
            X-Translation:
              schema:
                type: string
              description: Base64url-encoded translation truncated to 300 characters
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: '#/components/schemas/TranslateJsonResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          description: Idempotency request currently in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLargeError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
        '429':
          $ref: '#/components/responses/RateLimitedError'

  /device/heartbeat:
    post:
      summary: Device status heartbeat
      description: Reports device health metrics and returns config update status plus pending commands. Does NOT touch Postgres.
      parameters:
        - name: X-Device-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                firmware_version:
                  type: string
                rssi:
                  type: integer
                battery_pct:
                  type: integer
                uptime_sec:
                  type: integer
                config_version:
                  type: integer
      responses:
        '200':
          description: Heartbeat acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  config_up_to_date:
                    type: boolean
                  config_version:
                    type: integer
                  pending_commands:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeviceCommand'

  /device/config:
    get:
      summary: Get device configuration
      parameters:
        - name: X-Device-Key
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Device configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceConfig'

  /device/commands/{id}/ack:
    post:
      summary: Acknowledge command execution
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: X-Device-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [done, failed]
                detail:
                  type: string
      responses:
        '200':
          description: Command acknowledged

  /utterances:
    post:
      summary: Translate utterance or uploaded file from Dashboard / Machine API
      description: Accepts multipart/form-data or binary audio up to 4 MB. Supports MP3, WAV, PCM, M4A, OGG, WEBM, FLAC.
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [utterance, file]
            default: utterance
        - name: source
          in: query
          required: false
          schema:
            type: string
            default: auto
        - name: target
          in: query
          required: false
          schema:
            type: string
            default: es-US
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [wav, pcm]
            default: wav
        - name: device_id
          in: query
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                source:
                  type: string
                target:
                  type: string
          audio/wav:
            schema:
              type: string
              format: binary
          audio/mpeg:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Utterance processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UtteranceResponse'

  /languages:
    get:
      summary: List supported languages and enabled voices
      description: Returns list of supported languages with capabilities {stt, translate, tts}, valid target pairs, and voices in enabled providers.
      responses:
        '200':
          description: Supported languages
          content:
            application/json:
              schema:
                type: object
                properties:
                  languages:
                    type: array
                    items:
                      $ref: '#/components/schemas/Language'
                  total:
                    type: integer
                  enabled_tts_providers:
                    type: array
                    items:
                      type: string

  /admin/stats:
    get:
      summary: System metrics and SQL latency percentiles (last 24h)
      responses:
        '200':
          description: Analytics and percentiles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStats'

  /admin/health:
    get:
      summary: Cloud infrastructure and provider health check
      description: Checks Groq, xAI, Edge TTS, Redis, Postgres. Cached for 30 seconds to preserve free quotas.
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemHealth'

  /admin/settings:
    get:
      summary: Get system configuration and active provider chains
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
    put:
      summary: Update system settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdate'
      responses:
        '200':
          description: Updated settings

  /admin/devices:
    get:
      summary: List all devices
      responses:
        '200':
          description: Devices list
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items:
                      $ref: '#/components/schemas/Device'
    post:
      summary: Register new device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                config:
                  type: object
      responses:
        '201':
          description: Device created
          content:
            application/json:
              schema:
                type: object
                properties:
                  device:
                    $ref: '#/components/schemas/Device'
                  device_key:
                    type: string
                    description: Raw secret key (returned only once)

  /admin/devices/{id}:
    get:
      summary: Get device details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
    patch:
      summary: Update device name or status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                status:
                  type: string
                  enum: [active, revoked]
      responses:
        '200':
          description: Updated device
    delete:
      summary: Delete device
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Device deleted

  /admin/devices/{id}/config:
    put:
      summary: Update device configuration
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Updated device config

  /admin/devices/{id}/rotate-key:
    post:
      summary: Rotate device secret key
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: New raw device key generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  device_id:
                    type: string
                  device_key:
                    type: string

  /admin/devices/{id}/revoke:
    post:
      summary: Immediately revoke device key
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Device revoked

  /admin/devices/{id}/commands:
    get:
      summary: List commands for device
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  commands:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeviceCommand'
    post:
      summary: Enqueue command to device
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command_type]
              properties:
                command_type:
                  type: string
                  enum: [reboot, update_firmware, ping]
                payload:
                  type: object
      responses:
        '201':
          description: Command enqueued

  /admin/devices/{id}/telemetry:
    get:
      summary: Get device telemetry samples
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: range
          in: query
          required: false
          schema:
            type: string
            enum: [1h, 6h, 24h, 7d]
            default: 24h
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  samples:
                    type: array
                    items:
                      $ref: '#/components/schemas/TelemetrySample'

  /admin/jobs:
    get:
      summary: List translation jobs
      parameters:
        - name: device_id
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Jobs list
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/Job'
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Job'
                  total:
                    type: integer
                  next_cursor:
                    type: string

  /admin/jobs/{id}:
    get:
      summary: Get job details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
    delete:
      summary: Delete job and associated audio
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job deleted

  /admin/jobs/{id}/retry:
    post:
      summary: Retry a failed or stored job
      description: Works ONLY when job can_retry is true (i.e. input audio was stored).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job retried
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          description: cannot_retry error when store_audio was false

  /admin/jobs/{id}/audio/{type}:
    get:
      summary: Authenticated audio streaming
      description: Stream stored original or translated audio from Vercel Blob through authenticated endpoint. Never exposes public URLs.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [original, translated]
      responses:
        '200':
          description: Audio stream
          content:
            audio/wav:
              schema:
                type: string
                format: binary

  /admin/conversations:
    get:
      summary: List conversations
      parameters:
        - name: device_id
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Conversation'

  /admin/conversations/{id}:
    get:
      summary: Get conversation with turns
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'

  /admin/api-keys:
    get:
      summary: List machine API keys
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_keys:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiKey'
    post:
      summary: Generate new machine API key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '201':
          description: API key generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    $ref: '#/components/schemas/ApiKey'
                  secret:
                    type: string
                    description: Raw secret API key (returned only once)

  /admin/api-keys/{id}:
    delete:
      summary: Revoke machine API key
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: API key revoked

  /cron/retention:
    get:
      summary: Daily retention cleanup
      description: Cleans up jobs and audio blobs older than retention_days. Protected by CRON_SECRET.
      responses:
        '200':
          description: Retention cleanup successful

components:
  schemas:
    TranslateJsonResponse:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        source_language:
          type: string
        detected_language:
          type: string
        target_language:
          type: string
        transcript:
          type: string
        translation:
          type: string
        audio:
          type: object
          properties:
            format:
              type: string
            sample_rate:
              type: integer
            duration_ms:
              type: number
            base64:
              type: string
        duration_ms:
          type: number
        timings:
          type: object
          properties:
            stt_ms:
              type: number
            translate_ms:
              type: number
            synthesize_ms:
              type: number
            total_ms:
              type: number

    UtteranceResponse:
      type: object
      properties:
        job_id:
          type: string
        id:
          type: string
        status:
          type: string
        source_language:
          type: string
        detected_language:
          type: string
        target_language:
          type: string
        transcript:
          type: string
        translation:
          type: string
        can_retry:
          type: boolean
        audio:
          type: object
          properties:
            format:
              type: string
            sample_rate:
              type: integer
            duration_ms:
              type: number
            base64:
              type: string
            url:
              type: string
        timings:
          type: object
          properties:
            stt_ms:
              type: number
            translate_ms:
              type: number
            synthesize_ms:
              type: number
            total_ms:
              type: number

    Job:
      type: object
      properties:
        jobId:
          type: string
        kind:
          type: string
        deviceId:
          type: string
        conversationId:
          type: string
        status:
          type: string
        sourceLanguage:
          type: string
        detectedLanguage:
          type: string
        targetLanguage:
          type: string
        transcript:
          type: string
        translation:
          type: string
        canRetry:
          type: boolean
        durationSec:
          type: number
        sttMs:
          type: number
        translateMs:
          type: number
        synthesizeMs:
          type: number
        totalMs:
          type: number
        createdAt:
          type: string
        updatedAt:
          type: string

    Device:
      type: object
      properties:
        id:
          type: string
        device_id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, revoked]
        online:
          type: boolean
        last_seen:
          type: string
        firmware_version:
          type: string
        rssi:
          type: integer
        config_version:
          type: integer
        applied_config_version:
          type: integer
        config:
          $ref: '#/components/schemas/DeviceConfig'

    DeviceConfig:
      type: object
      properties:
        language_a:
          type: string
        language_b:
          type: string
        mode:
          type: string
          enum: [auto, buttons]
        max_utterance_sec:
          type: integer
        volume:
          type: integer
        tts_speed:
          type: number
        mic_gain:
          type: number
        conversation_idle_sec:
          type: integer
        config_version:
          type: integer

    DeviceCommand:
      type: object
      properties:
        id:
          type: string
        device_id:
          type: string
        type:
          type: string
        status:
          type: string
          enum: [pending, delivered, done, failed, expired]
        created_at:
          type: string
        acked_at:
          type: string
        detail:
          type: string

    TelemetrySample:
      type: object
      properties:
        ts:
          type: string
        rssi:
          type: integer
        free_heap:
          type: integer
        battery_pct:
          type: integer
        uptime_sec:
          type: integer

    Conversation:
      type: object
      properties:
        conversationId:
          type: string
        deviceId:
          type: string
        createdAt:
          type: string
        lastUtteranceAt:
          type: string
        utteranceCount:
          type: integer
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/Job'

    Language:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        capabilities:
          type: object
          properties:
            stt:
              type: boolean
            translate:
              type: boolean
            tts:
              type: boolean
        valid_targets:
          type: array
          items:
            type: string
        voices:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              gender:
                type: string
              neural:
                type: boolean
              provider:
                type: string

    ApiKey:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        key_prefix:
          type: string
        created_at:
          type: string
        last_used_at:
          type: string
        status:
          type: string
          enum: [active, revoked]

    Settings:
      type: object
      properties:
        service_enabled:
          type: boolean
        max_utterance_sec:
          type: integer
        max_file_size_mb:
          type: integer
        max_duration_sec:
          type: integer
        retention_days:
          type: integer
        store_audio:
          type: boolean
        language_id_min_confidence:
          type: number
        conversation_idle_sec:
          type: integer
        device_rate_limit_per_min:
          type: integer
        device_daily_quota:
          type: integer
        default_heartbeat_interval_sec:
          type: integer
        allowed_languages:
          type: array
          items:
            type: string
        providers:
          type: object
          description: Read-only provider status block
          properties:
            stt_chains:
              type: array
              items:
                type: string
            translate_chains:
              type: array
              items:
                type: string
            tts_chains:
              type: array
              items:
                type: string
            allow_paid_fallback:
              type: boolean
            models:
              type: object

    SettingsUpdate:
      type: object
      properties:
        service_enabled:
          type: boolean
        max_utterance_sec:
          type: integer
        retention_days:
          type: integer
        store_audio:
          type: boolean
        device_rate_limit_per_min:
          type: integer
        device_daily_quota:
          type: integer

    AdminStats:
      type: object
      properties:
        counts_by_status:
          type: object
        counts_by_kind:
          type: object
        jobs_per_day:
          type: array
          items:
            type: object
        failure_rate:
          type: number
        devices_online:
          type: integer
        devices_total:
          type: integer
        top_language_pairs:
          type: array
          items:
            type: object
        total_audio_minutes:
          type: number
        utterances_today:
          type: integer
        jobs_in_progress:
          type: integer
        latency:
          type: object
          properties:
            total:
              type: object
              properties:
                p50:
                  type: number
                p95:
                  type: number
            stt:
              type: object
              properties:
                p50:
                  type: number
                p95:
                  type: number
            translate:
              type: object
              properties:
                p50:
                  type: number
                p95:
                  type: number
            synthesize:
              type: object
              properties:
                p50:
                  type: number
                p95:
                  type: number

    SystemHealth:
      type: object
      properties:
        services:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              status:
                type: string
                enum: [healthy, degraded, down]
              checked_at:
                type: string
              latency_ms:
                type: number
        offline_devices:
          type: array
          items:
            type: object
        recent_failures:
          type: array
          items:
            type: object

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            retry_after_sec:
              type: integer

  responses:
    BadRequestError:
      description: Invalid request parameters or body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnauthorizedError:
      description: Authentication required or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLargeError:
      description: Audio payload exceeds 4 MB size limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntityError:
      description: Semantic error (silence detected, unsupported language pair, low confidence)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimitedError:
      description: Rate limit or daily quota exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
